# Nihongo Dictionary E2E Kanji Stroke Order Flow
#
# Validates:
# - Search query for word with Kanji ("食べる")
# - Navigation to Word Detail
# - Inspection of constituent kanji ("食")
# - Navigation to Kanji Detail Screen
# - Verification of Stroke Order Canvas and play control

appId: id.nihongodictionary.app.debug
tags:
  - kanji
  - stroke-order
---
# 1. Launch Application
- launchApp:
    clearState: false

# Dismiss any system alerts/overlays if present
- tapOn:
    text: "OKE"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- extendedWaitUntil:
    visible: "Kata Umum"
    timeout: 10000

# 2. Search Word
- tapOn:
    text: ".*Ketik Kanji.*"
- inputText: "taberu"

- extendedWaitUntil:
    visible: "食べる"
    timeout: 5000

# 3. Open Word Detail
- tapOn: "食べる"

- extendedWaitUntil:
    visible: "Detail Kosakata"
    timeout: 5000

# 4. Tap Constituent Kanji "食"
- scrollUntilVisible:
    element: "食"
    direction: DOWN
    timeout: 5000

- tapOn: "食"

# 5. Verify Kanji Detail Screen
- extendedWaitUntil:
    visible: "Detail Kanji"
    timeout: 5000

- assertVisible: ".*Urutan Coretan.*"

# 6. Interact with Stroke Order Controls
- tapOn: "Putar Animasi"

- assertVisible: ".*Arti Bahasa Indonesia.*"
- assertVisible: ".*Onyomi.*"
- assertVisible: ".*Kunyomi.*"

- takeScreenshot: 02-kanji-stroke-detail
